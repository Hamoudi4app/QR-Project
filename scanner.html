<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فاحص رمز QR الذكي</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #26c6da;
      --secondary-color: #00acc1;
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: #1c1f26;
      --text-main: #eee;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 { color: var(--primary-color); margin-bottom: 10px; }
    p { color: #bbb; margin-bottom: 25px; }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #111;
    }

    .file-label {
      background: rgba(255,255,255,0.1);
      color: var(--text-main);
      border: 1px dashed var(--primary-color);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      filter: brightness(1.1);
    }

    #reader {
      width: 100% !important;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
      margin-top: 15px;
      border: 2px solid var(--primary-color);
      display: none; /* يظهر فقط عند تشغيل الكاميرا */
    }

    #resultBox {
      margin-top: 25px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #qrResult {
      word-break: break-all;
      font-weight: bold;
      margin: 10px 0;
      display: block;
    }

    /* تنسيق زر الأكشن (زيارة الرابط أو النسخ) */
    #actionBtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 10px 20px;
      background: var(--primary-color);
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-back {
      margin-top: 25px;
      color: var(--primary-color);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
    }

    .btn-back:hover { text-decoration: underline; }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1><i class="fa-solid fa-qrcode"></i> ماسح QR</h1>
    <p>قم بتوجيه الكاميرا نحو الرمز أو ارفع صورة</p>

    <div class="controls">
      <button id="toggleCam" class="btn btn-primary">
        <i class="fa-solid fa-camera"></i> تشغيل الكاميرا
      </button>

      <input type="file" id="qrFile" style="display:none" accept="image/*">
      <label for="qrFile" class="btn file-label">
        <i class="fa-solid fa-file-import"></i> اختيار صورة من الجهاز
      </label>
    </div>

    <div id="reader"></div>

    <div id="resultBox">
      <span style="color: var(--primary-color);">النتيجة:</span>
      <div id="qrResult">في انتظار المسح...</div>
      <div id="actionContainer"></div>
    </div>

    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> العودة للمولد</a>
  </div>

  <footer>جميع الحقوق محفوظة © محمد فيصل</footer>

  <script>
    let html5QrCode = null;
    let camActive = false;

    // دالة عرض النتائج وتجهيز زر الأكشن
    function handleResult(decodedText) {
      const resultElement = document.getElementById("qrResult");
      const actionContainer = document.getElementById("actionContainer");
      
      resultElement.innerText = decodedText;
      resultElement.style.color = "#4caf50";
      actionContainer.innerHTML = "";

      // التحقق إذا كان المحتوى رابطاً
      const isUrl = /^(http|https):\/\/[^ "]+$/.test(decodedText.trim());

      if (isUrl) {
        const link = document.createElement("a");
        link.href = decodedText.trim();
        link.target = "_blank";
        link.id = "actionBtn";
        link.innerHTML = '<i class="fa-solid fa-external-link"></i> زيارة الرابط';
        actionContainer.appendChild(link);
      } else {
        const copyBtn = document.createElement("button");
        copyBtn.id = "actionBtn";
        copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> نسخ النص';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(decodedText);
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ!';
          setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> نسخ النص', 2000);
        };
        actionContainer.appendChild(copyBtn);
      }

      // اهتزاز بسيط للهواتف عند النجاح
      if (navigator.vibrate) navigator.vibrate(100);
    }

    // معالجة رفع الصور
    document.getElementById("qrFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        const img = new Image();
        img.src = reader.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = img.width; canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, canvas.width, canvas.height);
          
          if (code) {
            handleResult(code.data);
          } else {
            document.getElementById("qrResult").innerText = "تعذر العثور على رمز في هذه الصورة";
            document.getElementById("qrResult").style.color = "#f44336";
          }
        };
      };
      reader.readAsDataURL(file);
    });

    // تشغيل/إيقاف الكاميرا
    document.getElementById("toggleCam").addEventListener("click", async () => {
      const btn = document.getElementById("toggleCam");
      const readerDiv = document.getElementById("reader");

      if (!camActive) {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        readerDiv.style.display = "block";
        
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (text) => {
              handleResult(text);
              // اختياري: إيقاف الكاميرا تلقائياً بعد أول مسح ناجح
              // stopCamera(); 
            }
          );
          camActive = true;
          btn.innerHTML = '<i class="fa-solid fa-stop"></i> إيقاف الكاميرا';
          btn.style.background = "#f44336";
        } catch (err) {
          alert("خطأ في الوصول للكاميرا: " + err);
        }
      } else {
        stopCamera();
      }
    });

    async function stopCamera() {
      if (html5QrCode) {
        await html5QrCode.stop();
        document.getElementById("reader").style.display = "none";
        const btn = document.getElementById("toggleCam");
        btn.innerHTML = '<i class="fa-solid fa-camera"></i> تشغيل الكاميرا';
        btn.style.background = "linear-gradient(135deg, var(--primary-color), var(--secondary-color))";
        camActive = false;
      }
    }
  </script>
</body>
</html>
