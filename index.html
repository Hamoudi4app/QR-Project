<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مولد رمز QR متطور</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7744635661972873"
     crossorigin="anonymous"></script>
  
<script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>  
  
  <!-- مكتبة QRCode -->
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- سكربت AdSense للإعلانات التلقائية (لا يحتاج ad-slot) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7744635661972873" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#eee; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh;
      position:relative; flex-direction:column;
    }
    .top-left { position: fixed; top: 15px; left: 15px; z-index: 999; }
    .btn-nav { background:#26c6da; color:#111; padding:6px 10px; border-radius:8px; font-size:13px; text-decoration:none; font-weight:bold; transition:.3s; }
    .btn-nav:hover { background:#00acc1; transform:scale(1.05); }

    .card {
      background:#1c1f26; border-radius:16px; padding:30px; width:90%; max-width:500px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4); text-align:center;
      animation:slideUp 1s ease forwards; opacity:0;
    }
    h1 { color:#26c6da; animation:fadeIn 1.2s ease forwards; opacity:0; }
    p  { color:#bbb;    animation:fadeIn 1.5s ease forwards; opacity:0; }

    input[type="text"], input[type="color"] {
      width:90%; padding:12px; margin:8px 0; border-radius:10px; border:none; outline:none;
      background:#2a2f3a; color:#eee; transition:transform .3s, box-shadow .3s;
    }
    input:focus { transform:scale(1.05); box-shadow:0 0 10px #26c6da; }
    label { display:block; margin-top:10px; color:#aaa; font-size:14px; animation:fadeIn 1.8s ease forwards; opacity:0; }

    .btn {
      padding:12px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;
      margin:6px; display:inline-flex; align-items:center; gap:8px; font-size:15px;
      animation:fadeIn 2s ease forwards; opacity:0; transition:.3s;
    }
    .btn-primary   { background:linear-gradient(135deg,#26c6da,#00acc1); color:#111; }
    .btn-secondary { background:#2a2f3a; color:#eee; }
    .btn:hover     { transform:translateY(-2px) scale(1.05); box-shadow:0 4px 12px rgba(0,0,0,.3); }

    .actions { display:flex; flex-wrap:wrap; justify-content:center; margin-top:15px; }

    .loading-bar {
      width:100%; height:30px; background:#2a2f3a; border-radius:6px; overflow:hidden;
      margin-top:15px; display:none; position:relative; color:#fff; font-weight:bold;
      align-items:center; justify-content:center;
    }
    .loading-bar div {
      position:absolute; left:0; top:0; height:100%; width:0%;
      background:linear-gradient(90deg,#26c6da,#00acc1); z-index:0;
    }
    .loading-bar span { position:relative; z-index:1; }
    @keyframes loading { from{width:0%;} to{width:100%;} }

    #qrcode {
      margin-top:20px; padding:20px; background:#fff; border-radius:12px; display:inline-block; opacity:0;
    }
    @keyframes fadeInQR { from{opacity:0;} to{opacity:1;} }

    @keyframes fadeIn { to{opacity:1;} }
    @keyframes slideUp { from{transform:translateY(50px);opacity:0;} to{transform:translateY(0);opacity:1;} }

    @media (max-width: 600px) {
      .card { padding:20px; width:95%; }
      h1 { font-size:20px; }
      p  { font-size:14px; }
      .btn { width:100%; font-size:16px; justify-content:center; }
      #qrcode { width:200px; height:200px; padding:10px; }
      .loading-bar { height:25px; font-size:14px; }
      input[type="text"],input[type="color"] { width:100%; }
    }
  </style>
</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-7744635661972873">
</amp-auto-ads>
  
  <!-- زر الفحص -->
  <div class="top-left">
    <a href="scanner.html" class="btn-nav"><i class="fa-solid fa-camera"></i> فحص QR</a>
  </div>

  <div class="card">
    <h1>مولد رمز QR</h1>
    <p>ألصق الرابط أو النص، اختر الألوان، ثم اضغط توليد:</p>

    <input id="linkInput" type="text" placeholder="https://example.com" />
    <label>لون الرمز:</label>
    <input type="color" id="colorDark" value="#000000" />
    <label>لون الخلفية:</label>
    <input type="color" id="colorLight" value="#ffffff" />

    <div class="actions">
      <button class="btn btn-primary" id="genBtn"><i class="fa-solid fa-qrcode"></i> توليد QR</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="downloadBtn" disabled><i class="fa-solid fa-download"></i> تنزيل PNG</button>
      <button class="btn btn-secondary" id="shareBtn" disabled><i class="fa-solid fa-share-alt"></i> مشاركة</button>
      <button class="btn btn-secondary" id="clearBtn"><i class="fa-solid fa-trash"></i> مسح</button>
    </div>

    <div class="loading-bar" id="loadingBar">
      <div id="loadingFill"></div>
      <span>جارِ التوليد...</span>
    </div>

    <div id="qrcode"></div>
  </div>

  <script>
    let qr = null;

    function libraryReady() { return typeof QRCode !== "undefined" && QRCode; }

    function enableUI() {
      const qrBox = document.getElementById("qrcode");
      qrBox.style.animation = "fadeInQR 1s ease forwards";
      qrBox.style.opacity = "1";
      document.getElementById("downloadBtn").disabled = false;
      document.getElementById("shareBtn").disabled = false;
    }

    function showWhenReady() {
      const qrBox = document.getElementById("qrcode");
      const canvas = qrBox.querySelector("canvas");
      const img = qrBox.querySelector("img");

      if (canvas) { enableUI(); return; }
      if (img) {
        if (img.complete) { enableUI(); return; }
        img.onload = enableUI;
        return;
      }

      let tries = 0;
      const watch = setInterval(() => {
        const c = qrBox.querySelector("canvas");
        const i = qrBox.querySelector("img");
        if (c || (i && i.complete)) { clearInterval(watch); enableUI(); }
        if (++tries > 40) clearInterval(watch);
      }, 50);
    }

    function generateQR() {
      const text = document.getElementById("linkInput").value.trim();
      const colorDark  = document.getElementById("colorDark").value;
      const colorLight = document.getElementById("colorLight").value;

      if (!text) { alert("من فضلك أدخل نص أو رابط"); return; }
      if (!libraryReady()) { alert("المكتبة لم تُحمّل بعد. تحقّق من اتصالك."); return; }

      const qrBox = document.getElementById("qrcode");
      const loadingBar = document.getElementById("loadingBar");
      const fill = document.getElementById("loadingFill");

      qrBox.innerHTML = "";
      qrBox.style.opacity = "0";
      qrBox.style.animation = "none";

      loadingBar.style.display = "flex";
      fill.style.width = "0%";
      fill.style.animation = "none";
      void fill.offsetWidth;
      fill.style.animation = "loading 1200ms linear forwards";

      setTimeout(() => {
        try {
          qr = new QRCode(qrBox, {
            text: text,
            width: 240,
            height: 240,
            colorDark: colorDark,
            colorLight: colorLight,
            correctLevel: QRCode.CorrectLevel.M
          });
          loadingBar.style.display = "none";
          showWhenReady();
        } catch (e) {
          loadingBar.style.display = "none";
          alert("حدث خطأ أثناء توليد الرمز. تأكد من صحة النص/الرابط.");
          console.error(e);
        }
      }, 1200);
    }

    function downloadQR() {
      const canvas = document.querySelector("#qrcode canvas");
      const img    = document.querySelector("#qrcode img");
      if (!canvas && !img) { alert("أعد توليد QR أولاً"); return; }

      if (canvas) {
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "qr.png"; a.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      } else {
        const a = document.createElement("a");
        a.href = img.src; a.download = "qr.png"; a.click();
      }
    }

    async function shareQR() {
      const canvas = document.querySelector("#qrcode canvas");
      const img    = document.querySelector("#qrcode img");
      if (!canvas && !img) { alert("أعد توليد QR أولاً"); return; }

      let blob;
      if (canvas) {
        blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      } else {
        const response = await fetch(img.src);
        blob = await response.blob();
      }
      const file = new File([blob], "qr.png", { type: "image/png" });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "رمز QR" }); }
        catch { alert("تم إلغاء المشاركة أو حدث خطأ"); }
      } else {
        alert("المشاركة المباشرة غير مدعومة في هذا المتصفح");
      }
    }

    function clearQR() {
      document.getElementById("linkInput").value = "";
      const qrBox = document.getElementById("qrcode");
      qrBox.innerHTML = "";
      qrBox.style.opacity = "0";
      document.getElementById("downloadBtn").disabled = true;
      document.getElementById("shareBtn").disabled = true;
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("genBtn").addEventListener("click", generateQR);
      document.getElementById("downloadBtn").addEventListener("click", downloadQR);
      document.getElementById("shareBtn").addEventListener("click", shareQR);
      document.getElementById("clearBtn").addEventListener("click", clearQR);
    });
  </script>
</body>
</html>
