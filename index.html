<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مولد رمز QR متطور</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling/lib/qr-code-styling.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#eee; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh;
      flex-direction:column;
    }
    .card {
      background:#1c1f26; border-radius:16px; padding:30px; width:90%; max-width:520px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4); text-align:center;
    }
    h1 { color:#26c6da; }
    p  { color:#bbb; }
    input, select {
      width:90%; padding:12px; margin:8px 0; border-radius:10px; border:none; outline:none;
      background:#2a2f3a; color:#eee;
    }
    input:focus, select:focus { box-shadow:0 0 10px #26c6da; }
    .btn {
      padding:10px 18px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;
      margin:6px; display:inline-flex; align-items:center; gap:6px; font-size:14px;
      transition:.3s;
    }
    .btn-primary   { background:linear-gradient(135deg,#26c6da,#00acc1); color:#111; }
    .btn-secondary { background:#2a2f3a; color:#eee; }
    .btn:hover     { transform:scale(1.05); box-shadow:0 4px 12px rgba(0,0,0,.3); }
    #qrcode { margin-top:20px; display:none; }
    .top-left { position: fixed; top: 15px; left: 15px; z-index: 999; }
    .file-input { display:none; }
    .file-label {
      background:linear-gradient(135deg,#26c6da,#00acc1); color:#111;
      padding:10px 18px; border-radius:8px; font-weight:bold; cursor:pointer;
      display:inline-flex; align-items:center; gap:6px; transition:.3s;
    }
    .file-label:hover { transform:scale(1.05); box-shadow:0 4px 12px rgba(0,0,0,.3); }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; margin-top:15px; }

    /* شريط التحميل */
    .loading-bar {
      width:100%; height:20px; background:#2a2f3a; border-radius:10px;
      margin-top:15px; overflow:hidden; display:none;
    }
    .loading-fill {
      height:100%; width:0%; background:linear-gradient(90deg,#26c6da,#00acc1);
      transition:width 1.5s linear;
    }
  </style>
</head>
<body>
  <div class="top-left">
    <a href="scanner.html" class="btn btn-primary"><i class="fa-solid fa-camera"></i> فحص QR</a>
  </div>

  <div class="card">
    <h1>مولد رمز QR متطور</h1>
    <p>أدخل النص أو الرابط، اختر الإعدادات، ثم اضغط توليد:</p>

    <input id="linkInput" type="text" placeholder="https://example.com" />
    <label>لون الرمز:</label>
    <input type="color" id="colorDark" value="#000000" />
    <label>لون الخلفية:</label>
    <input type="color" id="colorLight" value="#ffffff" />
    <label>الحجم:</label>
    <select id="sizeSelect">
      <option value="240">صغير (240px)</option>
      <option value="320">متوسط (320px)</option>
      <option value="500">كبير (500px)</option>
    </select>

    <input type="file" id="logoInput" class="file-input" accept="image/*" />
    <label for="logoInput" class="file-label"><i class="fa-solid fa-image"></i> اختر ملف شعار</label>

    <div class="actions">
      <button class="btn btn-primary" id="genBtn"><i class="fa-solid fa-qrcode"></i> توليد QR</button>
      <button class="btn btn-secondary" id="downloadBtn" disabled><i class="fa-solid fa-download"></i> تنزيل PNG</button>
      <button class="btn btn-secondary" id="copyBtn" disabled><i class="fa-solid fa-copy"></i> نسخ النص</button>
      <button class="btn btn-secondary" id="clearBtn"><i class="fa-solid fa-trash"></i> مسح</button>
    </div>

    <!-- شريط التحميل -->
    <div class="loading-bar" id="loadingBar">
      <div class="loading-fill" id="loadingFill"></div>
    </div>

    <div id="qrcode"></div>
  </div>

  <script>
    let qrCode = null;
    let logoFile = null;

    document.getElementById("logoInput").addEventListener("change", (e) => {
      logoFile = e.target.files[0];
    });

    function generateQR() {
      const text = document.getElementById("linkInput").value.trim();
      const colorDark  = document.getElementById("colorDark").value;
      const colorLight = document.getElementById("colorLight").value;
      const size = parseInt(document.getElementById("sizeSelect").value);

      if (!text) { alert("من فضلك أدخل نص أو رابط"); return; }

      const options = {
        width: size,
        height: size,
        data: text,
        dotsOptions: { color: colorDark, type: "rounded" },
        backgroundOptions: { color: colorLight }
      };

      if (logoFile) {
        const reader = new FileReader();
        reader.onload = () => { options.image = reader.result; startLoading(options); };
        reader.readAsDataURL(logoFile);
      } else {
        startLoading(options);
      }
    }

    function startLoading(options){
      const bar = document.getElementById("loadingBar");
      const fill = document.getElementById("loadingFill");
      const qrBox = document.getElementById("qrcode");
      qrBox.style.display = "none";
      bar.style.display = "block";
      fill.style.width = "0%";
      setTimeout(()=>{ fill.style.width = "100%"; },50);
      setTimeout(()=>{
        createQR(options);
        bar.style.display = "none";
        qrBox.style.display = "block";
      },1600);
    }

    function createQR(options) {
      const qrBox = document.getElementById("qrcode");
      qrBox.innerHTML = "";
      qrCode = new QRCodeStyling(options);
      qrCode.append(qrBox);
      document.getElementById("downloadBtn").disabled = false;
      document.getElementById("copyBtn").disabled = false;
    }

    function downloadQR() { if (qrCode) qrCode.download({ name: "qr-code", extension: "png" }); }
    async function copyText() {
      const text = document.getElementById("linkInput").value.trim();
      if (!text) return;
      try { await navigator.clipboard.writeText(text); alert("✅ النص تم نسخه"); }
      catch { alert("⚠️ تعذر النسخ، انسخ يدويًا"); }
    }
    function clearQR() {
      document.getElementById("linkInput").value = "";
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("qrcode").style.display = "none";
      document.getElementById("downloadBtn").disabled = true;
      document.getElementById("copyBtn").disabled = true;
    }

    document.getElementById("genBtn").addEventListener("click", generateQR);
    document.getElementById("downloadBtn").addEventListener("click", downloadQR);
    document.getElementById("copyBtn").addEventListener("click", copyText);
    document.getElementById("clearBtn").addEventListener("click", clearQR);
  </script>
</body>
</html>
